name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ViaRust APK (aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK Platforms & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias androidreleasekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=ViaRust, OU=Mobile, O=zsx0809, C=US"

      - name: Build and Sign Release APK
        run: |
          cargo apk build --release --target aarch64-linux-android
          mkdir -p output
          RAW_APK=$(find target -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --ks-key-alias androidreleasekey \
            --key-pass pass:android \
            --out output/ViaRust-release-arm64.apk \
            "$RAW_APK"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViaRust-APK
          path: output/ViaRust-release-arm64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.1.0-alpha
          name: "ViaRust v0.1.0 Alpha (Slint Edition)"
          body: |
            ### ViaRust 极简浏览器首个构建版本
            - 纯白极简首屏（1:1 复刻 Via）
            - 经典细边框居中药丸搜索栏
            - 底部五联导航栏与 2x5 网格二级功能抽屉
            - 接入 GitHub Secret Gist 书签云同步
            - 集成即时网页翻译
            - 基于 Rust + Slint 超轻量架构，已完整打上 Android v1/v2/v3 证书签名
          files: output/ViaRust-release-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
