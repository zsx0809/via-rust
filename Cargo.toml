[package]
name = "via-rust"
version = "0.1.0"
edition = "2021"
authors = ["zsx0809"]
description = "Ultra-lightweight Android browser inspired by Via, built with Rust and Slint."

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "renderer-femtovg", "backend-android-activity-06"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json", "tls"] }
urlencoding = "2.1"

[build-dependencies]
slint-build = "1.8"

[package.metadata.android]
package = "com.zsx0809.viarust"
label = "ViaRust"
min_sdk_version = 26
target_sdk_version = 34
build_targets = ["aarch64-linux-android"]

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "android"
key_password = "android"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
